<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tier Digital is a performance-driven digital agency helping ambitious brands scale with paid social, creative strategy, and full-funnel analytics."
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:title" content="Tier Digital | Growth Agency for Ambitious Brands" />
    <meta
      property="og:description"
      content="Data-driven Meta ads, creative strategy, and analytics that turn ad spend into predictable revenue."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tierdigital.co" />
    <meta property="og:image" content="https://tierdigital.co/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tierdigital.co" />
    <title>Tier Digital | Growth Agency for Ambitious Brands</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
